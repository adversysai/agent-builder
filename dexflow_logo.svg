<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="1200" viewBox="0 0 1200 1200" 
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  
  <!-- Background -->
  <rect width="1200" height="1200" fill="#FFFFFF"/>
  
  <!-- Connection paths -->
  <g id="connections" stroke="#49FF16" stroke-width="5.5" 
     stroke-linecap="round" fill="none">
    <path d="M 490.0,585.0 Q 600.0,662.0 710.0,585.0"/>
    <path d="M 710.0,585.0 Q 709.25,469.0 600.0,430.0"/>
    <path d="M 600.0,430.0 Q 490.75,469.0 490.0,585.0"/>
  </g>
  
  <!-- Agent nodes -->
  <g id="nodes">

    <!-- Node 1 -->
    <g>
      <!-- Outer glow -->
      <circle cx="490.0" cy="585.0" r="70" 
              fill="#49FF16" opacity="0.12"/>
      <circle cx="490.0" cy="585.0" r="61" 
              fill="#49FF16" opacity="0.20"/>
      
      <!-- Main node -->
      <circle cx="490.0" cy="585.0" r="52" 
              fill="#49FF16"/>
      
      <!-- Inner ring -->
      <circle cx="490.0" cy="585.0" r="26" 
              fill="#FFFFFF"/>
      
      <!-- Core dot -->
      <circle cx="490.0" cy="585.0" r="8" 
              fill="#49FF16"/>
    </g>

    <!-- Node 2 -->
    <g>
      <!-- Outer glow -->
      <circle cx="710.0" cy="585.0" r="70" 
              fill="#49FF16" opacity="0.12"/>
      <circle cx="710.0" cy="585.0" r="61" 
              fill="#49FF16" opacity="0.20"/>
      
      <!-- Main node -->
      <circle cx="710.0" cy="585.0" r="52" 
              fill="#49FF16"/>
      
      <!-- Inner ring -->
      <circle cx="710.0" cy="585.0" r="26" 
              fill="#FFFFFF"/>
      
      <!-- Core dot -->
      <circle cx="710.0" cy="585.0" r="8" 
              fill="#49FF16"/>
    </g>

    <!-- Node 3 -->
    <g>
      <!-- Outer glow -->
      <circle cx="600.0" cy="430.0" r="70" 
              fill="#49FF16" opacity="0.12"/>
      <circle cx="600.0" cy="430.0" r="61" 
              fill="#49FF16" opacity="0.20"/>
      
      <!-- Main node -->
      <circle cx="600.0" cy="430.0" r="52" 
              fill="#49FF16"/>
      
      <!-- Inner ring -->
      <circle cx="600.0" cy="430.0" r="26" 
              fill="#FFFFFF"/>
      
      <!-- Core dot -->
      <circle cx="600.0" cy="430.0" r="8" 
              fill="#49FF16"/>
    </g>

  </g>
  
  <!-- Typography -->
  <g id="typography">
    <!-- Main wordmark -->
    <text x="600.0" y="780.0" 
          font-family="Helvetica, Arial, sans-serif" 
          font-size="68" 
          font-weight="400"
          fill="#1a1a1a" 
          text-anchor="middle" 
          dominant-baseline="middle">DEXFLOW</text>
    
    <!-- Tagline with letter spacing -->
    <text x="600.0" y="830.0" 
          font-family="Helvetica, Arial, sans-serif" 
          font-size="16" 
          font-weight="400"
          fill="#737373" 
          text-anchor="middle" 
          letter-spacing="6"
          dominant-baseline="middle">AI WORKFLOW AUTOMATION</text>
  </g>
  
</svg>